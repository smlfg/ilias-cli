[project]
name = "ilias-cli"
version = "0.1.0"
description = "CLI for ILIAS (HHN) - login, status, logout"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=24",
    "pydantic>=2",
    "rich>=13",
    "selectolax>=0.3",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright"]

[project.scripts]
ilias = "ilias_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_core", "src/ilias_cli"]

[tool.uv]
package = true
