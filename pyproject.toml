[project]
name = "ilias-cli"
version = "0.1.0"
description = "Kommandozeilen-Tool für ILIAS (HHN, Uni Mannheim) und Moodle (HS Mannheim): Login, Session, Kurse, Kursinhalt"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Fleig" }]
keywords = ["ilias", "moodle", "lms", "cli", "hochschule", "hhn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "keyring>=25.0",
]

[project.urls]
Homepage = "https://github.com/smlfg/ilias-cli"
Source = "https://github.com/smlfg/ilias-cli"
Issues = "https://github.com/smlfg/ilias-cli/issues"

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
ilias = "ilias_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_core", "src/ilias_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
