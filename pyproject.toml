[project]
name = "ilias-cli"
version = "0.1.0"
description = "ILIAS-CLI (HHN): Skeleton-Vertrag. Implementierungen liegen auf attempt/*-Branches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "keyring>=24",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
ilias = "ilias_cli.main:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_core", "src/ilias_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
