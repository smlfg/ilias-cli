[project]
name = "ilias-cli"
version = "0.1.0"
description = "ILIAS CLI (HHN) - login, status, logout. Later the core of an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Fleig" }]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "keyring>=24.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
ilias = "ilias_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_core", "src/ilias_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# GLUE (Vergleichs-Repo): pytest in die standardmäßig installierte dev-Gruppe, damit `uv sync` die Akzeptanztests lauffähig macht.
[dependency-groups]
dev = ["pytest>=8.0"]
