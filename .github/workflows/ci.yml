name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Lenient: nur Syntaxfehler und undefinierte Namen brechen den Build.
      - run: uvx ruff check --select E9,F63,F7,F82 --output-format=github .

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Akzeptanztests (Login-Teil, F1 + A1–A6)
        run: uv run pytest tests/acceptance -q -rA --junitxml=acceptance.xml
      - name: Eigene Tests der Implementierung (falls vorhanden)
        if: always() && hashFiles('tests/attempt/**') != ''
        continue-on-error: true
        run: uv run pytest tests/attempt -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: acceptance.xml
