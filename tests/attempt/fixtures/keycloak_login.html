<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Anmeldung - Keycloak</title>
</head>
<body>
  <div id="kc-form-login-wrapper">
    <form id="kc-form-login" action="https://login.hs-heilbronn.de/realms/hhn/login-actions/authenticate?session_code=SESSIONCODE123&amp;execution=EXEC456&amp;client_id=hhn_common_ilias&amp;tab_id=TAB789" method="post">
      <input type="hidden" name="credentialId" value="" />
      <div class="form-group">
        <label for="username">Benutzername oder E-Mail</label>
        <input id="username" name="username" type="text" autofocus />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" />
      </div>
      <div class="form-group">
        <input id="kc-login" type="submit" value="Anmelden" />
      </div>
    </form>
  </div>
</body>
</html>
