<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Anmelden bei hhn</title>
</head>
<body class="login-pf">
  <div id="kc-header">
    <h1 id="kc-header-wrapper">hhn</h1>
  </div>
  <div id="kc-content">
    <div id="kc-form">
      <div id="kc-form-wrapper">
        <form id="kc-form-login"
              action="https://login.hs-heilbronn.de/realms/hhn/login-actions/authenticate?session_code=abc123session&amp;execution=def456execution&amp;client_id=hhn_common_ilias&amp;tab_id=ghi789tab"
              method="post">
          <div class="form-group">
            <label for="username">Benutzername oder E-Mail</label>
            <input tabindex="1" id="username" name="username" value="" type="text"
                   autofocus autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Passwort</label>
            <input tabindex="2" id="password" name="password" type="password"
                   autocomplete="current-password">
          </div>
          <input type="hidden" id="credentialId" name="credentialId" value="">
          <input name="login" id="kc-login" type="submit" value="Anmelden">
        </form>
      </div>
    </div>
  </div>
</body>
</html>
