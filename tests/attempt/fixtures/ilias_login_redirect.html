<!DOCTYPE html>
<html>
<head>
    <title>ILIAS - Login</title>
</head>
<body>
    <div id="il_page">
        <div id="il_container">
            <form id="login_form" action="https://ilias.hs-heilbronn.de/login.php" method="post">
                <input type="hidden" name="client_id" value="iliashhn">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username">
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password">
                </div>
                <button type="submit">Anmelden</button>
            </form>
        </div>
    </div>
</body>
</html>
